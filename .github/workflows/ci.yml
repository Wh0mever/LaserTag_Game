name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      versionType:
        description: "Published makes the new version live; Saved uploads it without releasing it."
        type: choice
        default: Published
        options: [Published, Saved]

# Two merges in quick succession would otherwise race to publish, and the loser
# could land second with older content. Queue them instead of cancelling: a
# publish that has already started should finish.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    name: Format (StyLua)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ok-nick/setup-aftman@v0.4.2
      - run: stylua --check src/ tests/

  lint:
    name: Lint (Selene)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ok-nick/setup-aftman@v0.4.2
      # Uses the pinned lasertag.yml standard library, so no API dump download.
      - run: selene src/ tests/

  test:
    name: Unit tests (Luau CLI)
    runs-on: ubuntu-latest
    env:
      # Pinned like every other tool in aftman.toml. An upstream release must
      # not be able to turn a pull request red on its own; bump this on purpose.
      LUAU_VERSION: "0.735"
    steps:
      - uses: actions/checkout@v4
      - name: Download Luau CLI
        env:
          # Unauthenticated api.github.com calls share a 60-per-hour quota with
          # every other job on the runner's IP, which is the likeliest way this
          # step fails for a reason that has nothing to do with the change.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o release.json \
            "https://api.github.com/repos/luau-lang/luau/releases/tags/${LUAU_VERSION}"; then
            echo "::error::Could not read the Luau ${LUAU_VERSION} release: the tag may not exist, the token may be rejected, or api.github.com is unreachable."
            exit 1
          fi

          # Discovered rather than hardcoded: if upstream renames the archive,
          # this fails here with the list of what it does publish, instead of
          # 404-ing later on a guessed URL.
          URL="$(jq -r 'first(.assets[] | select(.name | test("(ubuntu|linux).*\\.zip")) | .browser_download_url) // empty' release.json)"
          if [ -z "${URL}" ]; then
            echo "::error::Luau ${LUAU_VERSION} publishes no Linux archive. Assets in this release:"
            jq -r '.assets[].name' release.json
            exit 1
          fi

          if ! curl -fsSL -o luau.zip "${URL}"; then
            echo "::error::Downloading ${URL} failed."
            exit 1
          fi

          unzip -oq luau.zip -d .luau

          # -print -quit rather than a pipe into head: under pipefail, head
          # closing the pipe early would fail the step on a successful find.
          BIN="$(find .luau -maxdepth 2 -type f -name luau -print -quit)"
          if [ -z "${BIN}" ]; then
            echo "::error::No luau binary inside the archive. It contains:"
            unzip -l luau.zip
            exit 1
          fi

          chmod +x "${BIN}"

          # Executing a trivial script, not --version: the Luau CLI has no
          # version flag and exits non-zero on an unknown one, which under
          # `set -e` would fail this step on a perfectly good binary. Running
          # code is also the property the next step actually depends on.
          printf 'print("luau ok")\n' > smoke.luau
          "${BIN}" smoke.luau
          rm smoke.luau

          echo "LUAU_BIN=${BIN}" >> "${GITHUB_ENV}"
      - name: Run tests
        run: |
          "${LUAU_BIN}" tests/run.luau

  harness:
    name: Execute Roblox code (Lune)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ok-nick/setup-aftman@v0.4.2
      # Most of this repository only runs inside Roblox. The harness executes it
      # against Lune's real Instance/CFrame/Enum implementations, so a bad
      # property or a broken map definition fails here rather than in a playtest.
      - run: lune run tests/harness/run

  build:
    name: Build place (Rojo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ok-nick/setup-aftman@v0.4.2
      - run: rojo build default.project.json -o LaserTag.rbxlx
      - uses: actions/upload-artifact@v4
        with:
          name: LaserTag-place
          path: LaserTag.rbxlx

  publish:
    name: Publish to Roblox
    runs-on: ubuntu-latest
    # Every check has to pass first. Publishing is the one job here with an
    # effect outside this repository, so it is also the one that must never run
    # on a red tree.
    needs: [format, lint, test, harness, build]
    # Never from a pull request, and never from a branch: a fork's PR must not
    # be able to reach the live game, and neither should a work-in-progress
    # branch that happens to be green.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      # The exact file the other jobs verified, rather than a fresh build. A
      # rebuild would almost certainly be identical, and "almost certainly" is
      # not what should be standing between a green test run and a live game.
      - uses: actions/download-artifact@v4
        with:
          name: LaserTag-place

      - name: Publish place
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID }}
          # Publishing makes the version live; Saved uploads it without
          # releasing it. A push to main publishes; a manual run can choose.
          VERSION_TYPE: ${{ github.event.inputs.versionType || 'Published' }}
        run: |
          set -euo pipefail

          # A clone of this repository has none of these, and that is not a
          # failure — it just has nowhere to publish to. Skipping loudly beats
          # a red tick that means "you did not configure an optional feature".
          if [ -z "${ROBLOX_API_KEY}" ] || [ -z "${ROBLOX_UNIVERSE_ID}" ] || [ -z "${ROBLOX_PLACE_ID}" ]; then
            echo "::notice::Roblox publishing is not configured; skipping. Set ROBLOX_API_KEY, ROBLOX_UNIVERSE_ID and ROBLOX_PLACE_ID to enable it."
            exit 0
          fi

          if [ ! -f LaserTag.rbxlx ]; then
            echo "::error::LaserTag.rbxlx was not in the build artifact."
            exit 1
          fi

          # Content-Type is what tells Roblox how to read the body: application/xml
          # for the .rbxlx Rojo produces, application/octet-stream for a binary
          # .rbxl. Sending the wrong one is rejected rather than misparsed, but the
          # error does not say which of the two it wanted.
          STATUS="$(curl -sS -o response.json -w '%{http_code}' \
            -X POST \
            -H "x-api-key: ${ROBLOX_API_KEY}" \
            -H "Content-Type: application/xml" \
            --data-binary @LaserTag.rbxlx \
            "https://apis.roblox.com/universes/v1/${ROBLOX_UNIVERSE_ID}/places/${ROBLOX_PLACE_ID}/versions?versionType=${VERSION_TYPE}")"

          if [ "${STATUS}" != "200" ]; then
            echo "::error::Roblox returned HTTP ${STATUS}."
            # The body carries the actual reason — a wrong scope, a place that is
            # not in that universe, an expired key — and none of it is secret.
            cat response.json || true
            echo ""
            case "${STATUS}" in
              401) echo "::error::401 usually means the API key is wrong, expired, or its IP allow-list excludes GitHub's runners." ;;
              403) echo "::error::403 usually means the key lacks universe-places:write for this universe." ;;
              404) echo "::error::404 usually means the universe or place id is wrong, or the place is not part of that universe." ;;
            esac
            exit 1
          fi

          VERSION="$(jq -r '.versionNumber // empty' response.json)"
          if [ -z "${VERSION}" ]; then
            echo "::error::Roblox accepted the upload but returned no version number:"
            cat response.json
            echo ""
            exit 1
          fi

          echo "::notice::${VERSION_TYPE} place version ${VERSION}."
          {
            echo "### Roblox"
            echo ""
            echo "- **${VERSION_TYPE}** version \`${VERSION}\`"
            echo "- Place \`${ROBLOX_PLACE_ID}\` in universe \`${ROBLOX_UNIVERSE_ID}\`"
            echo "- From commit \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
